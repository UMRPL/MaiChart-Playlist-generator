<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maimai Playlist Previewer</title>
<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#e84bab;--color-primary-hover:#c5348f;
  --color-primary-highlight:#f7d6ee;
  --shadow-sm:0 1px 2px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 12px 32px rgba(0,0,0,.14);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-full:9999px;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-6:1.5rem;
  --space-8:2rem;--space-12:3rem;--space-16:4rem;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
}
[data-theme="dark"]{
  --color-bg:#0e0d0c;--color-surface:#161513;--color-surface-2:#1c1b18;
  --color-surface-offset:#1a1917;--color-border:#2e2d2a;--color-divider:#252421;
  --color-text:#d8d5cf;--color-text-muted:#7a7875;--color-text-faint:#4a4845;
  --color-primary:#f06ec0;--color-primary-hover:#f990ce;
  --color-primary-highlight:#3a1f30;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;background:var(--color-bg);color:var(--color-text);
  font-family:'Segoe UI',system-ui,sans-serif;font-size:var(--text-base)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
img{display:block;max-width:100%}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
header{background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:var(--space-4) var(--space-6);display:flex;align-items:center;gap:var(--space-4);
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:var(--space-3)}
.logo svg{color:var(--color-primary)}
.logo-text{font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em}
.logo-text span{color:var(--color-primary)}
.header-actions{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:.5rem 1rem;
  border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;transition:all .18s ease;border:1px solid transparent}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-ghost{background:transparent;border-color:var(--color-border);color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
.btn-danger{background:transparent;border-color:#ff6d6d44;color:#ff6d6d}
.btn-danger:hover{background:#ff6d6d22}
.theme-btn{padding:.5rem;border-radius:var(--radius-md);color:var(--color-text-muted);border:1px solid var(--color-border)}
.theme-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.session-indicator{font-size:var(--text-xs);color:var(--color-text-faint);display:flex;align-items:center;gap:4px}
.session-dot{width:7px;height:7px;border-radius:50%;background:#6daa45;flex-shrink:0}
main{padding:var(--space-6);max-width:1400px;margin-inline:auto;width:100%}
.drop-zone{border:2px dashed var(--color-border);border-radius:var(--radius-xl);
  padding:var(--space-16);text-align:center;transition:all .2s ease;
  background:var(--color-surface)}
.drop-zone.drag-over{border-color:var(--color-primary);background:var(--color-primary-highlight)}
.drop-zone-icon{font-size:3rem;margin-bottom:var(--space-4);opacity:.4}
.drop-zone h2{font-size:var(--text-xl);margin-bottom:var(--space-2)}
.drop-zone p{color:var(--color-text-muted);margin-bottom:var(--space-6)}
.toolbar{display:flex;gap:var(--space-3);align-items:center;margin-bottom:var(--space-6);flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:.5rem 1rem .5rem 2.5rem;border-radius:var(--radius-md);
  border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);
  font-size:var(--text-sm)}
.search-box input:focus{outline:2px solid var(--color-primary);outline-offset:2px;border-color:transparent}
.search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--color-text-faint);pointer-events:none}
.filter-select{padding:.5rem .75rem;border-radius:var(--radius-md);border:1px solid var(--color-border);
  background:var(--color-surface);color:var(--color-text);font-size:var(--text-sm)}
.filter-select:focus{outline:2px solid var(--color-primary);outline-offset:2px}
.count-badge{padding:.25rem .75rem;background:var(--color-surface-offset);border-radius:var(--radius-full);
  font-size:var(--text-xs);color:var(--color-text-muted);white-space:nowrap}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-4)}
.chart-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);overflow:hidden;transition:all .2s ease;cursor:pointer}
.chart-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.jacket-wrap{position:relative;aspect-ratio:1;background:var(--color-surface-offset);overflow:hidden}
.jacket-wrap img{width:100%;height:100%;object-fit:cover}
.jacket-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:3rem;color:var(--color-text-faint)}
.diff-badges{position:absolute;bottom:var(--space-2);left:var(--space-2);display:flex;gap:4px;flex-wrap:wrap}
.diff-badge{padding:2px 6px;border-radius:var(--radius-sm);font-size:.65rem;font-weight:700;
  letter-spacing:.02em;backdrop-filter:blur(8px)}
/* lv_2=Basic, lv_3=Advanced, lv_4=Expert, lv_5=Master, lv_6=Re:Master, lv_7=Utage */
.diff-2{background:rgba(159,221,143,.88);color:#1a3d10}
.diff-3{background:rgba(251,205,112,.88);color:#4a2e00}
.diff-4{background:rgba(255,109,109,.88);color:#4a0000}
.diff-5{background:rgba(200,120,255,.88);color:#2a004a}
.diff-6{background:rgba(255,255,255,.88);color:#222}
.diff-7{background:rgba(255,180,80,.88);color:#3a1800}
.card-body{padding:var(--space-3) var(--space-4)}
.card-title{font-size:var(--text-sm);font-weight:600;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-artist{font-size:var(--text-xs);color:var(--color-text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:var(--space-2)}
.card-meta{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.genre-tag{padding:2px 8px;background:var(--color-primary-highlight);color:var(--color-primary);
  border-radius:var(--radius-full);font-size:.65rem;font-weight:600}
.bpm-tag{font-size:var(--text-xs);color:var(--color-text-faint)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:var(--space-4);
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--color-surface);border-radius:var(--radius-xl);max-width:700px;width:100%;
  max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.96);
  transition:transform .2s ease;position:relative}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;gap:var(--space-4);padding:var(--space-6);border-bottom:1px solid var(--color-border)}
.modal-jacket{width:120px;height:120px;border-radius:var(--radius-lg);
  background:var(--color-surface-offset);flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:2.5rem;color:var(--color-text-faint);overflow:hidden}
.modal-jacket img{width:100%;height:100%;object-fit:cover}
.modal-info{flex:1;min-width:0}
.modal-title{font-size:var(--text-xl);font-weight:700;margin-bottom:var(--space-1);line-height:1.2}
.modal-artist{color:var(--color-text-muted);margin-bottom:var(--space-3)}
.modal-tags{display:flex;gap:var(--space-2);flex-wrap:wrap}
.modal-tag{padding:4px 10px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600}
.tag-genre{background:var(--color-primary-highlight);color:var(--color-primary)}
.tag-bpm,.tag-ver{background:var(--color-surface-offset);color:var(--color-text-muted)}
.modal-body{padding:var(--space-6)}
.section-label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;
  color:var(--color-text-faint);font-weight:700;margin-bottom:var(--space-3)}
.diff-table{width:100%;border-collapse:collapse;margin-bottom:var(--space-6)}
.diff-table th,.diff-table td{padding:var(--space-2) var(--space-3);text-align:left;
  border-bottom:1px solid var(--color-divider);font-size:var(--text-sm)}
.diff-table th{font-weight:600;color:var(--color-text-muted);font-size:var(--text-xs)}
.diff-table tr:last-child td{border-bottom:none}
.diff-name{display:flex;align-items:center;gap:var(--space-2)}
.diff-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-2{background:#9fdd8f}.dot-3{background:#fbcd70}.dot-4{background:#ff6d6d}
.dot-5{background:#c878ff}.dot-6{background:#e8e8e8}.dot-7{background:#ffb450}
.lv-display{font-weight:700;font-size:var(--text-base)}
.notes-section{background:var(--color-surface-2);border-radius:var(--radius-lg);
  padding:var(--space-4);font-size:var(--text-xs);font-family:monospace;
  max-height:200px;overflow-y:auto;white-space:pre-wrap;color:var(--color-text-muted);
  border:1px solid var(--color-border)}
.close-btn{position:absolute;top:var(--space-4);right:var(--space-4);
  padding:var(--space-2);border-radius:var(--radius-md);color:var(--color-text-muted);
  border:1px solid var(--color-border)}
.close-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.empty-state{text-align:center;padding:var(--space-16);color:var(--color-text-muted)}
.empty-state .ei{font-size:3rem;margin-bottom:var(--space-4);opacity:.3}
.notes-toggle{font-size:var(--text-xs);color:var(--color-primary);cursor:pointer;
  margin-bottom:var(--space-2);display:inline-flex;align-items:center;gap:4px}
.notes-toggle:hover{text-decoration:underline}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4)}
.loading-overlay.hidden{display:none}
.spinner{width:48px;height:48px;border:4px solid var(--color-border);
  border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--color-text);font-size:var(--text-sm)}
.progress-bar-wrap{width:300px;height:6px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.progress-bar{height:100%;background:var(--color-primary);border-radius:var(--radius-full);
  transition:width .1s ease;width:0%}
</style>
</head>
<body>
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Wczytywanie...</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="app">
<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="logo">
      <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/>
      <circle cx="14" cy="14" r="6" fill="currentColor" opacity=".2"/>
      <circle cx="14" cy="14" r="2.5" fill="currentColor"/>
      <line x1="14" y1="1" x2="14" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="21" x2="14" y2="27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="1" y1="14" x2="7" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="21" y1="14" x2="27" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">mai<span>Preview</span></span>
  </div>
  <div class="header-actions">
    <span class="session-indicator" id="sessionIndicator" style="display:none">
      <span class="session-dot"></span> sesja zapisana
    </span>
    <button class="btn btn-ghost" onclick="document.getElementById('folderInput').click()">
      📂 Wczytaj foldery
    </button>
    <input type="file" id="folderInput" style="display:none" webkitdirectory multiple>
    <button class="btn btn-ghost" onclick="document.getElementById('playlistInput').click()">
      🎵 Wczytaj playlist
    </button>
    <input type="file" id="playlistInput" style="display:none" accept=".txt">
    <button class="btn btn-danger" id="clearBtn" style="display:none" onclick="clearSession()">
      🗑 Wyczyść
    </button>
    <button class="theme-btn" id="themeToggle" aria-label="Przełącz motyw">🌙</button>
  </div>
</header>
<main id="mainArea">
  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-icon">🎮</div>
    <h2>maimai Playlist Previewer</h2>
    <p>Przeciągnij tutaj folder z chartami (zawierający maidata.txt + bg.png)<br>lub użyj przycisku powyżej</p>
    <button class="btn btn-primary" onclick="document.getElementById('folderInput').click()">
      📂 Wybierz folder
    </button>
  </div>
</main>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeModalDirect()">✕</button>
    <div class="modal-header">
      <div class="modal-jacket" id="modalJacket">🎵</div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-artist" id="modalArtist"></div>
        <div class="modal-tags" id="modalTags"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="section-label">Poziomy trudności</div>
      <table class="diff-table">
        <thead><tr><th>Diff</th><th>Poziom</th><th>Designer</th></tr></thead>
        <tbody id="diffTableBody"></tbody>
      </table>
      <div id="notesSection"></div>
    </div>
  </div>
</div>

<script>
let allCharts = [];
let filteredCharts = [];
let currentTheme = localStorage.getItem('mmp_theme') || 'dark';

document.documentElement.setAttribute('data-theme', currentTheme);
document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('themeToggle').addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('mmp_theme', currentTheme);
});

const dropZone = document.getElementById('dropZone');
document.body.addEventListener('dragover', e => { e.preventDefault(); if(dropZone) dropZone.classList.add('drag-over'); });
document.body.addEventListener('dragleave', e => { if (!e.relatedTarget && dropZone) dropZone.classList.remove('drag-over'); });
document.body.addEventListener('drop', e => {
  e.preventDefault();
  if(dropZone) dropZone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

document.getElementById('folderInput').addEventListener('change', e => handleFiles(e.target.files));
document.getElementById('playlistInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  filterByPlaylist(await file.text());
});

function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// Accepted jacket/cover filenames (priority: first match wins)
const JACKET_NAMES = ['jacket.png','jacket.jpg','jacket.jpeg','bg.png','bg.jpg','bg.jpeg'];

// Diff slot mapping (lv_1 always unused, skip it):
// lv_2=Basic, lv_3=Advanced, lv_4=Expert, lv_5=Master, lv_6=Re:Master, lv_7=Utage
const DIFF_NAMES = {
  2: 'Basic',
  3: 'Advanced',
  4: 'Expert',
  5: 'Master',
  6: 'Re:Master',
  7: 'Utage'
};

function parseMaildata(text) {
  const get = key => {
    const m = text.match(new RegExp('&' + key + '=([^\\n\\r]*)'));
    return m ? m[1].trim() : '';
  };
  const diffs = [];
  for (let i = 2; i <= 7; i++) {
    const lv = get('lv_' + i);
    if (lv && lv !== '') {
      const inoteMatch = text.match(new RegExp('&inote_' + i + '=([\\s\\S]*?)(?=\\n&[a-z_]|$)'));
      diffs.push({
        index: i,
        name: DIFF_NAMES[i] || 'Diff ' + i,
        level: lv,
        designer: get('des_' + i) || '-',
        notes: inoteMatch ? inoteMatch[1].trim() : ''
      });
    }
  }
  return {
    title: get('title'), artist: get('artist'), bpm: get('wholebpm'),
    genre: get('genre'), version: get('version'), shortid: get('shortid'),
    diffs
  };
}

function showLoading(show, text='Wczytywanie...', pct=0) {
  const o = document.getElementById('loadingOverlay');
  o.classList.toggle('hidden', !show);
  document.getElementById('loadingText').textContent = text;
  document.getElementById('progressBar').style.width = pct + '%';
}

async function handleFiles(files) {
  const fileArr = Array.from(files);
  const dirs = {};
  for (const f of fileArr) {
    const parts = f.webkitRelativePath ? f.webkitRelativePath.split('/') : ['root', f.name];
    const dir = parts.slice(0, -1).join('/') || 'root';
    if (!dirs[dir]) dirs[dir] = { maidata: null, jacket: null, jacketPriority: 999 };
    const fname = parts[parts.length - 1].toLowerCase();
    if (fname === 'maidata.txt') {
      dirs[dir].maidata = f;
    } else {
      // Pick the jacket file with the highest priority (lowest index in JACKET_NAMES)
      const pri = JACKET_NAMES.indexOf(fname);
      if (pri !== -1 && pri < dirs[dir].jacketPriority) {
        dirs[dir].jacket = f;
        dirs[dir].jacketPriority = pri;
      }
    }
  }

  const entries = Object.entries(dirs).filter(([,e]) => e.maidata);
  if (entries.length === 0) { alert('Nie znaleziono żadnych chartów (brak plików maidata.txt).'); return; }

  showLoading(true, 'Wczytywanie chartów...', 0);
  const charts = [];

  for (let i = 0; i < entries.length; i++) {
    const [dir, entry] = entries[i];
    showLoading(true, `Wczytywanie ${i+1}/${entries.length}...`, Math.round((i/entries.length)*100));
    const text = await entry.maidata.text();
    const parsed = parseMaildata(text);
    if (!parsed.title) continue;
    let jacketBase64 = null;
    if (entry.jacket) jacketBase64 = await fileToBase64(entry.jacket);
    charts.push({ ...parsed, jacketBase64, dir });
    if (i % 20 === 0) await new Promise(r => setTimeout(r, 0));
  }

  showLoading(true, 'Zapisywanie sesji...', 95);
  allCharts = charts;
  filteredCharts = [...charts];

  try {
    localStorage.setItem('mmp_charts', JSON.stringify(allCharts));
    localStorage.setItem('mmp_saved_at', new Date().toLocaleString('pl-PL'));
  } catch(e) {
    try {
      const slim = allCharts.map(c => ({...c, jacketBase64: null}));
      localStorage.setItem('mmp_charts', JSON.stringify(slim));
      localStorage.setItem('mmp_saved_at', new Date().toLocaleString('pl-PL'));
    } catch(e2) { console.warn('localStorage quota exceeded, session not saved'); }
  }

  showLoading(false);
  renderUI();
}

function loadSession() {
  try {
    const raw = localStorage.getItem('mmp_charts');
    if (!raw) return false;
    allCharts = JSON.parse(raw);
    filteredCharts = [...allCharts];
    return allCharts.length > 0;
  } catch(e) { return false; }
}

function clearSession() {
  if (!confirm('Usunąć zapisaną sesję?')) return;
  localStorage.removeItem('mmp_charts');
  localStorage.removeItem('mmp_saved_at');
  allCharts = [];
  filteredCharts = [];
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('sessionIndicator').style.display = 'none';
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">🎮</div>
      <h2>maimai Playlist Previewer</h2>
      <p>Przeciągnij tutaj folder z chartami lub użyj przycisku powyżej</p>
      <button class="btn btn-primary" onclick="document.getElementById('folderInput').click()">
        📂 Wybierz folder
      </button>
    </div>`;
}

function filterByPlaylist(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (allCharts.length === 0) { alert('Najpierw wczytaj foldery z chartami!'); return; }
  filteredCharts = allCharts.filter(c =>
    lines.some(l => l === c.shortid || l.toLowerCase() === c.title.toLowerCase())
  );
  renderGrid(filteredCharts);
  updateCount();
}

function renderUI() {
  const savedAt = localStorage.getItem('mmp_saved_at');
  const si = document.getElementById('sessionIndicator');
  si.style.display = savedAt ? 'flex' : 'none';
  si.title = savedAt ? 'Ostatnio zapisano: ' + savedAt : '';
  document.getElementById('clearBtn').style.display = 'inline-flex';

  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Szukaj tytułu, artysty..." oninput="doSearch()">
      </div>
      <select class="filter-select" id="genreFilter" onchange="doSearch()">
        <option value="">Wszystkie gatunki</option>
      </select>
      <select class="filter-select" id="diffFilter" onchange="doSearch()">
        <option value="">Wszystkie trudności</option>
        <option value="2">Basic</option>
        <option value="3">Advanced</option>
        <option value="4">Expert</option>
        <option value="5">Master</option>
        <option value="6">Re:Master</option>
        <option value="7">Utage</option>
      </select>
      <span class="count-badge" id="countBadge">0 chartów</span>
    </div>
    <div class="charts-grid" id="chartsGrid"></div>
  `;
  const genres = [...new Set(allCharts.map(c => c.genre).filter(Boolean))].sort();
  const sel = document.getElementById('genreFilter');
  genres.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; sel.appendChild(o); });
  renderGrid(filteredCharts);
  updateCount();
}

function doSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const genre = document.getElementById('genreFilter').value;
  const diff = document.getElementById('diffFilter').value;
  filteredCharts = allCharts.filter(c => {
    const matchText = !q || c.title.toLowerCase().includes(q) || (c.artist||'').toLowerCase().includes(q);
    const matchGenre = !genre || c.genre === genre;
    const matchDiff = !diff || c.diffs.some(d => d.index == diff);
    return matchText && matchGenre && matchDiff;
  });
  renderGrid(filteredCharts);
  updateCount();
}

function updateCount() {
  const el = document.getElementById('countBadge');
  if (el) el.textContent = filteredCharts.length + ' chart' + (filteredCharts.length !== 1 ? 'ów' : '');
}

function renderGrid(charts) {
  const grid = document.getElementById('chartsGrid');
  if (!grid) return;
  if (charts.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="ei">🎵</div><p>Brak chartów spełniających kryteria.</p></div>';
    return;
  }
  grid.innerHTML = charts.map(c => {
    const idx = allCharts.indexOf(c);
    const imgTag = c.jacketBase64
      ? '<img src="' + c.jacketBase64 + '" alt="' + escHtml(c.title) + '" loading="lazy" width="260" height="260">'
      : '<div class="jacket-placeholder">🎵</div>';
    return '<div class="chart-card" onclick="openModal(' + idx + ')">' +
      '<div class="jacket-wrap">' + imgTag +
      '<div class="diff-badges">' + c.diffs.map(d =>
        '<span class="diff-badge diff-' + d.index + '">' + d.name + ' ' + d.level + '</span>'
      ).join('') + '</div></div>' +
      '<div class="card-body">' +
      '<div class="card-title" title="' + escHtml(c.title) + '">' + escHtml(c.title) + '</div>' +
      '<div class="card-artist">' + escHtml(c.artist || '—') + '</div>' +
      '<div class="card-meta">' +
      (c.genre ? '<span class="genre-tag">' + escHtml(c.genre) + '</span>' : '') +
      (c.bpm ? '<span class="bpm-tag">♩ ' + c.bpm + ' BPM</span>' : '') +
      '</div></div></div>';
  }).join('');
}

function openModal(idx) {
  const c = allCharts[idx];
  if (!c) return;
  const jEl = document.getElementById('modalJacket');
  jEl.innerHTML = c.jacketBase64
    ? '<img src="' + c.jacketBase64 + '" alt="' + escHtml(c.title) + '">'
    : '🎵';
  document.getElementById('modalTitle').textContent = c.title;
  document.getElementById('modalArtist').textContent = c.artist || '—';
  document.getElementById('modalTags').innerHTML = [
    c.genre ? '<span class="modal-tag tag-genre">' + escHtml(c.genre) + '</span>' : '',
    c.bpm   ? '<span class="modal-tag tag-bpm">♩ ' + c.bpm + ' BPM</span>' : '',
    c.version ? '<span class="modal-tag tag-ver">' + escHtml(c.version) + '</span>' : ''
  ].join('');
  document.getElementById('diffTableBody').innerHTML = c.diffs.map(d =>
    '<tr><td><div class="diff-name"><span class="diff-dot dot-' + d.index + '"></span>' + d.name + '</div></td>' +
    '<td><span class="lv-display">' + d.level + '</span></td>' +
    '<td style="color:var(--color-text-muted)">' + escHtml(d.designer) + '</td></tr>'
  ).join('');
  document.getElementById('notesSection').innerHTML = c.diffs.map(d => d.notes
    ? '<div style="margin-bottom:var(--space-4)"><div class="section-label">' + d.name + ' — notatki</div>' +
      '<span class="notes-toggle" onclick="var n=this.nextElementSibling;n.style.display=n.style.display===\'none\'?\'block\':\'none\'">👁 Pokaż/ukryj nuty</span>' +
      '<div class="notes-section" style="display:none">' + escHtml(d.notes) + '</div></div>'
    : ''
  ).join('');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.addEventListener('DOMContentLoaded', () => {
  if (loadSession()) renderUI();
});
</script>
</body>
</html>
