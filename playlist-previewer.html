<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maimai Playlist Previewer</title>
<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#e84bab;--color-primary-hover:#c5348f;
  --color-primary-highlight:#f7d6ee;
  --shadow-sm:0 1px 2px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 12px 32px rgba(0,0,0,.14);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-full:9999px;
  --sp1:.25rem;--sp2:.5rem;--sp3:.75rem;--sp4:1rem;--sp6:1.5rem;--sp8:2rem;--sp12:3rem;--sp16:4rem;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
}
[data-theme="dark"]{
  --color-bg:#0e0d0c;--color-surface:#161513;--color-surface-2:#1c1b18;
  --color-surface-offset:#1a1917;--color-border:#2e2d2a;--color-divider:#252421;
  --color-text:#d8d5cf;--color-text-muted:#7a7875;--color-text-faint:#4a4845;
  --color-primary:#f06ec0;--color-primary-hover:#f990ce;
  --color-primary-highlight:#3a1f30;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;background:var(--color-bg);color:var(--color-text);
  font-family:'Segoe UI',system-ui,sans-serif;font-size:var(--text-base)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
img{display:block;max-width:100%}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
header{background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:var(--sp4) var(--sp6);display:flex;align-items:center;gap:var(--sp4);
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:var(--sp3);flex-shrink:0}
.logo svg{color:var(--color-primary)}
.logo-text{font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em}
.logo-text span{color:var(--color-primary)}
.header-actions{margin-left:auto;display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:var(--sp2);padding:.45rem .9rem;
  border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;
  transition:all .18s ease;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-success{background:#437a22;color:#fff;border-color:#437a22}
.btn-success:hover{background:#2e5c10}
.btn-ghost{background:transparent;border-color:var(--color-border);color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
.btn-danger{background:transparent;border-color:#ff6d6d44;color:#ff6d6d}
.btn-danger:hover{background:#ff6d6d22}
.btn-sm{padding:.3rem .7rem;font-size:var(--text-xs)}
.theme-btn{padding:.45rem;border-radius:var(--radius-md);color:var(--color-text-muted);border:1px solid var(--color-border)}
.theme-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.session-indicator{font-size:var(--text-xs);color:var(--color-text-faint);display:flex;align-items:center;gap:4px}
.session-dot{width:7px;height:7px;border-radius:50%;background:#6daa45;flex-shrink:0}
main{padding:var(--sp6);max-width:1600px;margin-inline:auto;width:100%}
.drop-zone{border:2px dashed var(--color-border);border-radius:var(--radius-xl);
  padding:var(--sp16);text-align:center;transition:all .2s ease;background:var(--color-surface)}
.drop-zone.drag-over{border-color:var(--color-primary);background:var(--color-primary-highlight)}
.drop-zone-icon{font-size:3rem;margin-bottom:var(--sp4);opacity:.4}
.drop-zone h2{font-size:var(--text-xl);margin-bottom:var(--sp2)}
.drop-zone p{color:var(--color-text-muted);margin-bottom:var(--sp6)}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:var(--sp3);align-items:center;margin-bottom:var(--sp4);flex-wrap:wrap}
.search-box{flex:1;min-width:180px;position:relative}
.search-box input{width:100%;padding:.45rem 1rem .45rem 2.25rem;border-radius:var(--radius-md);
  border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);
  font-size:var(--text-sm)}
.search-box input:focus{outline:2px solid var(--color-primary);outline-offset:2px;border-color:transparent}
.search-icon{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--color-text-faint);pointer-events:none;font-size:.9rem}
.fsel{padding:.45rem .7rem;border-radius:var(--radius-md);border:1px solid var(--color-border);
  background:var(--color-surface);color:var(--color-text);font-size:var(--text-sm)}
.fsel:focus{outline:2px solid var(--color-primary);outline-offset:2px}
.count-badge{padding:.2rem .7rem;background:var(--color-surface-offset);border-radius:var(--radius-full);
  font-size:var(--text-xs);color:var(--color-text-muted);white-space:nowrap}
.sel-badge{padding:.2rem .7rem;background:var(--color-primary-highlight);border-radius:var(--radius-full);
  font-size:var(--text-xs);color:var(--color-primary);white-space:nowrap;display:none}

/* ── VIRTUAL SCROLL ── */
.vscroll-outer{position:relative;overflow-y:auto;max-height:calc(100dvh - 220px)}
.vscroll-spacer{position:relative;width:100%}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp3);
  position:absolute;top:0;left:0;right:0}

/* ── CARD ── */
.chart-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);overflow:hidden;transition:box-shadow .18s ease,transform .18s ease;
  cursor:pointer;position:relative}
.chart-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.chart-card.selected{border-color:var(--color-primary);box-shadow:0 0 0 2px var(--color-primary)}
.sel-checkbox{position:absolute;top:6px;right:6px;z-index:2;width:20px;height:20px;
  border-radius:var(--radius-sm);background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
  backdrop-filter:blur(4px);transition:background .15s ease}
.chart-card.selected .sel-checkbox{background:var(--color-primary);border-color:var(--color-primary)}
.jacket-wrap{position:relative;aspect-ratio:1;background:var(--color-surface-offset);overflow:hidden}
.jacket-wrap img{width:100%;height:100%;object-fit:cover}
.jacket-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:var(--color-text-faint)}
.diff-badges{position:absolute;bottom:4px;left:4px;display:flex;gap:3px;flex-wrap:wrap}
.diff-badge{padding:1px 5px;border-radius:3px;font-size:.6rem;font-weight:700;
  letter-spacing:.02em;backdrop-filter:blur(8px)}
.diff-2{background:rgba(159,221,143,.88);color:#1a3d10}
.diff-3{background:rgba(251,205,112,.88);color:#4a2e00}
.diff-4{background:rgba(255,109,109,.88);color:#4a0000}
.diff-5{background:rgba(200,120,255,.88);color:#2a004a}
.diff-6{background:rgba(255,255,255,.88);color:#222}
.diff-7{background:rgba(255,180,80,.88);color:#3a1800}
.card-body{padding:var(--sp2) var(--sp3)}
.card-title{font-size:var(--text-xs);font-weight:600;margin-bottom:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-artist{font-size:.65rem;color:var(--color-text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.card-meta{display:flex;gap:var(--sp2);flex-wrap:wrap;align-items:center}
.genre-tag{padding:1px 6px;background:var(--color-primary-highlight);color:var(--color-primary);
  border-radius:var(--radius-full);font-size:.6rem;font-weight:600}
.bpm-tag{font-size:.6rem;color:var(--color-text-faint)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:var(--sp4);
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--color-surface);border-radius:var(--radius-xl);max-width:680px;width:100%;
  max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.96);
  transition:transform .2s ease;position:relative}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;gap:var(--sp4);padding:var(--sp6);border-bottom:1px solid var(--color-border)}
.modal-jacket{width:110px;height:110px;border-radius:var(--radius-lg);
  background:var(--color-surface-offset);flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:2.2rem;color:var(--color-text-faint);overflow:hidden}
.modal-jacket img{width:100%;height:100%;object-fit:cover}
.modal-info{flex:1;min-width:0}
.modal-title{font-size:var(--text-xl);font-weight:700;margin-bottom:var(--sp1);line-height:1.2}
.modal-artist{color:var(--color-text-muted);margin-bottom:var(--sp3)}
.modal-tags{display:flex;gap:var(--sp2);flex-wrap:wrap}
.modal-tag{padding:3px 9px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600}
.tag-genre{background:var(--color-primary-highlight);color:var(--color-primary)}
.tag-bpm,.tag-ver{background:var(--color-surface-offset);color:var(--color-text-muted)}
.modal-body{padding:var(--sp6)}
.section-label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;
  color:var(--color-text-faint);font-weight:700;margin-bottom:var(--sp3)}
.diff-table{width:100%;border-collapse:collapse;margin-bottom:var(--sp6)}
.diff-table th,.diff-table td{padding:var(--sp2) var(--sp3);text-align:left;
  border-bottom:1px solid var(--color-divider);font-size:var(--text-sm)}
.diff-table th{font-weight:600;color:var(--color-text-muted);font-size:var(--text-xs)}
.diff-table tr:last-child td{border-bottom:none}
.diff-name{display:flex;align-items:center;gap:var(--sp2)}
.diff-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-2{background:#9fdd8f}.dot-3{background:#fbcd70}.dot-4{background:#ff6d6d}
.dot-5{background:#c878ff}.dot-6{background:#e8e8e8}.dot-7{background:#ffb450}
.lv-display{font-weight:700;font-size:var(--text-base)}
.notes-section{background:var(--color-surface-2);border-radius:var(--radius-lg);
  padding:var(--sp4);font-size:var(--text-xs);font-family:monospace;
  max-height:180px;overflow-y:auto;white-space:pre-wrap;color:var(--color-text-muted);
  border:1px solid var(--color-border)}
.close-btn{position:absolute;top:var(--sp4);right:var(--sp4);
  padding:var(--sp2);border-radius:var(--radius-md);color:var(--color-text-muted);
  border:1px solid var(--color-border)}
.close-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.notes-toggle{font-size:var(--text-xs);color:var(--color-primary);cursor:pointer;
  margin-bottom:var(--sp2);display:inline-flex;align-items:center;gap:4px}
.notes-toggle:hover{text-decoration:underline}
.empty-state{text-align:center;padding:var(--sp16);color:var(--color-text-muted)}
.empty-state .ei{font-size:3rem;margin-bottom:var(--sp4);opacity:.3}

/* ── PLAYLIST EXPORT MODAL ── */
.export-modal{background:var(--color-surface);border-radius:var(--radius-xl);max-width:520px;width:100%;
  box-shadow:var(--shadow-lg);padding:var(--sp6);position:relative}
.export-modal h3{font-size:var(--text-lg);font-weight:700;margin-bottom:var(--sp4)}
.export-field{margin-bottom:var(--sp4)}
.export-field label{display:block;font-size:var(--text-xs);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted);margin-bottom:var(--sp2)}
.export-field input{width:100%;padding:.45rem .75rem;border-radius:var(--radius-md);
  border:1px solid var(--color-border);background:var(--color-surface-2);color:var(--color-text);font-size:var(--text-sm)}
.export-field input:focus{outline:2px solid var(--color-primary);outline-offset:2px;border-color:transparent}
.export-info{padding:var(--sp3);background:var(--color-surface-offset);border-radius:var(--radius-md);
  font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--sp4);
  border:1px solid var(--color-border)}
.export-actions{display:flex;gap:var(--sp3);justify-content:flex-end}

/* ── LOADING ── */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp4)}
.loading-overlay.hidden{display:none}
.spinner{width:48px;height:48px;border:4px solid var(--color-border);
  border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--color-text);font-size:var(--text-sm)}
.progress-bar-wrap{width:300px;height:6px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.progress-bar{height:100%;background:var(--color-primary);border-radius:var(--radius-full);
  transition:width .1s ease;width:0%}
</style>
</head>
<body>
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Wczytywanie...</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="app">
<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-label="logo">
      <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/>
      <circle cx="14" cy="14" r="6" fill="currentColor" opacity=".2"/>
      <circle cx="14" cy="14" r="2.5" fill="currentColor"/>
      <line x1="14" y1="1" x2="14" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="21" x2="14" y2="27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="1" y1="14" x2="7" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="21" y1="14" x2="27" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">mai<span>Preview</span></span>
  </div>
  <div class="header-actions">
    <span class="session-indicator" id="sessionIndicator" style="display:none">
      <span class="session-dot"></span> sesja zapisana
    </span>
    <button class="btn btn-ghost" onclick="document.getElementById('folderInput').click()">📂 Foldery</button>
    <input type="file" id="folderInput" style="display:none" webkitdirectory multiple>
    <button class="btn btn-ghost" onclick="document.getElementById('playlistInput').click()">🎵 Playlist</button>
    <input type="file" id="playlistInput" style="display:none" accept=".json,.txt">
    <button class="btn btn-success" id="exportBtn" style="display:none" onclick="openExportModal()">⬇ Eksportuj playlist</button>
    <button class="btn btn-danger" id="clearBtn" style="display:none" onclick="clearSession()">🗑 Wyczyść</button>
    <button class="theme-btn" id="themeToggle" aria-label="Przełącz motyw">🌙</button>
  </div>
</header>
<main id="mainArea">
  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-icon">🎮</div>
    <h2>maimai Playlist Previewer</h2>
    <p>Przeciągnij tutaj folder z chartami (maidata.txt + bg.png)<br>lub użyj przycisku powyżej</p>
    <button class="btn btn-primary" onclick="document.getElementById('folderInput').click()">📂 Wybierz folder</button>

</main>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeModalDirect()">✕</button>
    <div class="modal-header">
      <div class="modal-jacket" id="modalJacket">🎵</div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-artist" id="modalArtist"></div>
        <div class="modal-tags" id="modalTags"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="section-label">Poziomy trudności</div>
      <table class="diff-table"><thead><tr><th>Diff</th><th>Poziom</th><th>Designer</th></tr></thead>
        <tbody id="diffTableBody"></tbody></table>
      <div id="notesSection"></div>
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="exportOverlay" onclick="closeExportModal(event)">
  <div class="export-modal">
    <button class="close-btn" onclick="document.getElementById('exportOverlay').classList.remove('open')">✕</button>
    <h3>⬇ Eksportuj playlist</h3>
    <div class="export-field">
      <label>Nazwa playlisty</label>
      <input type="text" id="exportName" placeholder="Moja playlista" value="Moja playlista">
    </div>
    <div class="export-info" id="exportInfo"></div>
    <div class="export-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('exportOverlay').classList.remove('open')">Anuluj</button>
      <button class="btn btn-success" onclick="doExport()">⬇ Pobierz JSON</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let allCharts = [];      // all loaded charts
let filtered = [];       // after filters
let selected = new Set();// indices into allCharts

let currentTheme = localStorage.getItem('mmp_theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);
document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('themeToggle').addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('themeToggle').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('mmp_theme', currentTheme);
});

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const JACKET_NAMES = ['jacket.png','jacket.jpg','jacket.jpeg','bg.png','bg.jpg','bg.jpeg'];
const DIFF_NAMES = {2:'Basic',3:'Advanced',4:'Expert',5:'Master',6:'Re:Master',7:'Utage'};
const DIFF_ORDER = [2,3,4,5,6,7];

// ─────────────────────────────────────────────
// DRAG & DROP
// ─────────────────────────────────────────────
const getDropZone = () => document.getElementById('dropZone');
document.body.addEventListener('dragover', e => { e.preventDefault(); getDropZone()?.classList.add('drag-over'); });
document.body.addEventListener('dragleave', e => { if (!e.relatedTarget) getDropZone()?.classList.remove('drag-over'); });
document.body.addEventListener('drop', e => {
  e.preventDefault(); getDropZone()?.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});
document.getElementById('folderInput').addEventListener('change', e => handleFiles(e.target.files));
document.getElementById('playlistInput').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  filterByPlaylist(await file.text(), file.name);
});

// ─────────────────────────────────────────────
// MD5 (for playlist export — matching generate_playlists.py)
// ─────────────────────────────────────────────
let _md5Loaded = false;
async function ensureMD5() {
  if (_md5Loaded) return;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  _md5Loaded = true;
}
async function computeHash(rawText) {
  await ensureMD5();
  const md5hex = SparkMD5.hash(rawText);
  const bytes = new Uint8Array(md5hex.match(/../g).map(h => parseInt(h, 16)));
  return btoa(String.fromCharCode(...bytes));
}

// ─────────────────────────────────────────────
// FILE READING
// ─────────────────────────────────────────────
function fileToBase64(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}
function fileToText(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => resolve('');
    r.readAsText(file, 'utf-8');
  });
}

// ─────────────────────────────────────────────
// PARSE maidata.txt
// ─────────────────────────────────────────────
function parseMaildata(text) {
  const get = key => { const m = text.match(new RegExp('&' + key + '=([^\n\r]*)')); return m ? m[1].trim() : ''; };
  const diffs = [];
  for (let i = 2; i <= 7; i++) {
    const lv = get('lv_' + i);
    if (lv) {
      const nm = text.match(new RegExp('&inote_' + i + '=([\\s\\S]*?)(?=\n&[a-z_]|$)'));
      diffs.push({
        index: i, name: DIFF_NAMES[i] || ('Diff ' + i),
        level: lv, designer: get('des_' + i) || '-',
        notes: nm ? nm[1].trim() : '',
        normLevel: normalizeLevel(lv)
      });
    }
  }
  return {
    title: get('title'), artist: get('artist'), bpm: get('wholebpm'),
    genre: get('genre'), version: get('version'), shortid: get('shortid'),
    diffs
  };
}
function normalizeLevel(lvStr) {
  const f = parseFloat(lvStr);
  if (isNaN(f)) return null;
  const base = Math.floor(f);
  return (f - base) >= 0.7 ? base + '+' : String(base);
}

// ─────────────────────────────────────────────
// LOADING
// ─────────────────────────────────────────────
function showLoading(show, text='Wczytywanie...', pct=0) {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
  document.getElementById('loadingText').textContent = text;
  document.getElementById('progressBar').style.width = pct + '%';
}

async function handleFiles(files) {
  const fileArr = Array.from(files);
  const dirs = {};
  for (const f of fileArr) {
    const parts = f.webkitRelativePath ? f.webkitRelativePath.split('/') : ['root', f.name];
    const dir = parts.slice(0,-1).join('/') || 'root';
    if (!dirs[dir]) dirs[dir] = { maidata: null, jacket: null, jacketPri: 999 };
    const fname = parts[parts.length-1].toLowerCase();
    if (fname === 'maidata.txt') dirs[dir].maidata = f;
    else { const pri = JACKET_NAMES.indexOf(fname); if (pri !== -1 && pri < dirs[dir].jacketPri) { dirs[dir].jacket = f; dirs[dir].jacketPri = pri; } }
  }
  const entries = Object.entries(dirs).filter(([,e]) => e.maidata);
  if (!entries.length) { alert('Nie znaleziono chartów (brak maidata.txt).'); return; }

  showLoading(true, 'Wczytywanie chartów...', 0);
  const charts = [];
  for (let i = 0; i < entries.length; i++) {
    const [dir, entry] = entries[i];
    if (i % 10 === 0) {
      showLoading(true, `Wczytywanie ${i+1}/${entries.length}...`, Math.round(i/entries.length*100));
      await new Promise(r => setTimeout(r, 0));
    }
    const rawText = await fileToText(entry.maidata);
    const parsed = parseMaildata(rawText);
    if (!parsed.title) continue;
    const hash = await computeHash(rawText);
    let jacketBase64 = null;
    if (entry.jacket) jacketBase64 = await fileToBase64(entry.jacket);
    charts.push({ ...parsed, jacketBase64, dir, hash });
  }

  showLoading(true, 'Zapisywanie sesji...', 95);
  allCharts = charts;
  selected.clear();

  try { localStorage.setItem('mmp_charts', JSON.stringify(allCharts)); localStorage.setItem('mmp_saved_at', new Date().toLocaleString('pl-PL')); }
  catch(e) {
    try { localStorage.setItem('mmp_charts', JSON.stringify(allCharts.map(c => ({...c, jacketBase64: null})))); } catch(e2) {}
  }
  showLoading(false);
  renderUI();
}

function loadSession() {
  try { const raw = localStorage.getItem('mmp_charts'); if (!raw) return false; allCharts = JSON.parse(raw); return allCharts.length > 0; } catch(e) { return false; }
}
function clearSession() {
  if (!confirm('Usunąć zapisaną sesję?')) return;
  localStorage.removeItem('mmp_charts'); localStorage.removeItem('mmp_saved_at');
  allCharts = []; filtered = []; selected.clear();
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('exportBtn').style.display = 'none';
  document.getElementById('sessionIndicator').style.display = 'none';
  document.getElementById('mainArea').innerHTML = `
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">🎮</div>
      <h2>maimai Playlist Previewer</h2>
      <p>Przeciągnij tutaj folder z chartami lub użyj przycisku powyżej</p>
      <button class="btn btn-primary" onclick="document.getElementById('folderInput').click()">📂 Wybierz folder</button>
    </div>`;
}

// ─────────────────────────────────────────────
// FILTER BY PLAYLIST FILE
// ─────────────────────────────────────────────
function filterByPlaylist(text, fname='') {
  if (!allCharts.length) { alert('Najpierw wczytaj foldery!'); return; }
  let ids = [];
  if (fname.endsWith('.json')) {
    try {
      const j = JSON.parse(text);
      ids = (j.SongHashs || []);
      const idSet = new Set(ids);
      filtered = allCharts.filter(c => idSet.has(c.hash));
    } catch(e) { alert('Błąd parsowania JSON playlisty'); return; }
  } else {
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    filtered = allCharts.filter(c => lines.some(l => l===c.shortid || l.toLowerCase()===c.title.toLowerCase()));
  }
  renderGrid();
  updateCount();
}

// ─────────────────────────────────────────────
// SELECT ALL / DESELECT ALL
// ─────────────────────────────────────────────
function toggleSelectAll() {
  const allFilteredIndices = filtered.map(c => allCharts.indexOf(c));
  const allSelected = allFilteredIndices.every(i => selected.has(i));
  if (allSelected) {
    // deselect all visible
    allFilteredIndices.forEach(i => selected.delete(i));
  } else {
    // select all visible
    allFilteredIndices.forEach(i => selected.add(i));
  }
  renderVisible();
  updateCount();
  updateSelectAllBtn();
}

function updateSelectAllBtn() {
  const btn = document.getElementById('selectAllBtn');
  if (!btn || !filtered.length) return;
  const allFilteredIndices = filtered.map(c => allCharts.indexOf(c));
  const allSelected = allFilteredIndices.length > 0 && allFilteredIndices.every(i => selected.has(i));
  btn.textContent = allSelected ? '☐ Odznacz wszystko' : '☑ Zaznacz wszystko';
}

// ─────────────────────────────────────────────
// RENDER UI (toolbar + grid)
// ─────────────────────────────────────────────
function renderUI() {
  const savedAt = localStorage.getItem('mmp_saved_at');
  const si = document.getElementById('sessionIndicator');
  si.style.display = savedAt ? 'flex' : 'none';
  si.title = savedAt ? 'Zapisano: ' + savedAt : '';
  document.getElementById('clearBtn').style.display = 'inline-flex';
  document.getElementById('exportBtn').style.display = 'inline-flex';

  const allVersions = [...new Set(allCharts.map(c=>c.version).filter(Boolean))].sort();
  const allGenres = [...new Set(allCharts.map(c=>c.genre).filter(Boolean))].sort();

  document.getElementById('mainArea').innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Szukaj tytułu, artysty..." oninput="doFilter()">
      </div>
      <select class="fsel" id="genreFilter" onchange="doFilter()">
        <option value="">Wszystkie gatunki</option>
        ${allGenres.map(g=>`<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('')}
      </select>
      <select class="fsel" id="versionFilter" onchange="doFilter()">
        <option value="">Wszystkie wersje</option>
        ${allVersions.map(v=>`<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('')}
      </select>
      <select class="fsel" id="diffFilter" onchange="doFilter()">
        <option value="">Wszystkie diff</option>
        <option value="2">Basic</option>
        <option value="3">Advanced</option>
        <option value="4">Expert</option>
        <option value="5">Master</option>
        <option value="6">Re:Master</option>
        <option value="7">Utage</option>
      </select>
      <span class="count-badge" id="countBadge">0 chartów</span>
      <span class="sel-badge" id="selBadge">0 wybranych</span>
      <button class="btn btn-ghost btn-sm" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none">☑ Zaznacz wszystko</button>
    </div>
    <div class="vscroll-outer" id="vscrollOuter">
      <div class="vscroll-spacer" id="vscrollSpacer">
        <div class="charts-grid" id="chartsGrid"></div>
      </div>
    </div>`;

  filtered = [...allCharts];
  renderGrid();
  updateCount();
  initVirtualScroll();
}

// ─────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────
function doFilter() {
  const q   = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const gen = document.getElementById('genreFilter')?.value||'';
  const ver = document.getElementById('versionFilter')?.value||'';
  const dif = document.getElementById('diffFilter')?.value||'';

  filtered = allCharts.filter(c => {
    if (q && !c.title.toLowerCase().includes(q) && !(c.artist||'').toLowerCase().includes(q)) return false;
    if (gen && c.genre !== gen) return false;
    if (ver && c.version !== ver) return false;
    if (dif && !c.diffs.some(d => d.index == dif)) return false;
    return true;
  });
  renderGrid();
  updateCount();
}

function updateCount() {
  const cb = document.getElementById('countBadge');
  if (cb) cb.textContent = filtered.length + ' chart' + (filtered.length !== 1 ? 'ów' : '');
  const sb = document.getElementById('selBadge');
  if (sb) {
    sb.textContent = selected.size + ' wybranych';
    sb.style.display = selected.size > 0 ? 'inline-flex' : 'none';
  }
  const sab = document.getElementById('selectAllBtn');
  if (sab) sab.style.display = filtered.length > 0 ? 'inline-flex' : 'none';
  updateSelectAllBtn();
}

// ─────────────────────────────────────────────
// VIRTUAL SCROLL
// ─────────────────────────────────────────────
const CARD_MIN = 200, CARD_GAP = 12, CARD_BODY_H = 68;
let vsColCount = 4, vsCardH = 0, vsScrollTop = 0, vsOuter = null;

function getCardHeight() {
  const outerW = vsOuter?.clientWidth || 800;
  const cols = Math.max(1, Math.floor((outerW + CARD_GAP) / (CARD_MIN + CARD_GAP)));
  vsColCount = cols;
  const cardW = (outerW - (cols-1)*CARD_GAP) / cols;
  return cardW + CARD_BODY_H;
}

function renderGrid() {
  const grid = document.getElementById('chartsGrid');
  const spacer = document.getElementById('vscrollSpacer');
  const outer = document.getElementById('vscrollOuter');
  if (!grid || !spacer || !outer) return;
  vsOuter = outer;

  if (!filtered.length) {
    spacer.style.height = '200px';
    grid.style.top = '0';
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="ei">🎵</div><p>Brak chartów spełniających kryteria.</p></div>';
    return;
  }

  vsCardH = getCardHeight();
  const rowH = vsCardH + CARD_GAP;
  const totalRows = Math.ceil(filtered.length / vsColCount);
  const totalH = totalRows * rowH - CARD_GAP;
  spacer.style.height = totalH + 'px';

  if (!outer._vsListenerAdded) {
    outer.addEventListener('scroll', () => { vsScrollTop = outer.scrollTop; renderVisible(); }, { passive: true });
    outer._vsListenerAdded = true;
  }
  vsScrollTop = outer.scrollTop;
  renderVisible();
}

function renderVisible() {
  const grid = document.getElementById('chartsGrid');
  const outer = document.getElementById('vscrollOuter');
  if (!grid || !outer || !filtered.length) return;

  vsCardH = getCardHeight();
  const rowH = vsCardH + CARD_GAP;
  const viewH = outer.clientHeight;
  const st = outer.scrollTop;

  const firstRow = Math.max(0, Math.floor(st / rowH) - 1);
  const lastRow  = Math.min(Math.ceil(filtered.length / vsColCount) - 1,
                             Math.ceil((st + viewH) / rowH) + 1);
  const firstIdx = firstRow * vsColCount;
  const lastIdx  = Math.min(filtered.length - 1, (lastRow + 1) * vsColCount - 1);

  grid.style.top = (firstRow * rowH) + 'px';
  grid.style.gridTemplateColumns = `repeat(${vsColCount}, 1fr)`;

  grid.innerHTML = '';
  for (let i = firstIdx; i <= lastIdx; i++) {
    const c = filtered[i];
    const globalIdx = allCharts.indexOf(c);
    const isSel = selected.has(globalIdx);
    const imgTag = c.jacketBase64
      ? `<img src="${c.jacketBase64}" alt="${escHtml(c.title)}" loading="lazy" decoding="async" width="200" height="200">`
      : '<div class="jacket-placeholder">🎵</div>';
    const div = document.createElement('div');
    div.className = 'chart-card' + (isSel ? ' selected' : '');
    div.innerHTML =
      `<div class="sel-checkbox" onclick="toggleSelect(event,${globalIdx})">${isSel?'✓':''}</div>`+
      `<div class="jacket-wrap" onclick="openModal(${globalIdx})">${imgTag}`+
      `<div class="diff-badges">${c.diffs.map(d=>`<span class="diff-badge diff-${d.index}">${d.name} ${d.level}</span>`).join('')}</div></div>`+
      `<div class="card-body" onclick="openModal(${globalIdx})">`+
      `<div class="card-title" title="${escHtml(c.title)}">${escHtml(c.title)}</div>`+
      `<div class="card-artist">${escHtml(c.artist||'—')}</div>`+
      `<div class="card-meta">${c.genre?`<span class="genre-tag">${escHtml(c.genre)}</span>`:''}`+
      `${c.bpm?`<span class="bpm-tag">♩ ${c.bpm} BPM</span>`:''}</div></div>`;
    grid.appendChild(div);
  }
}

function initVirtualScroll() {
  const outer = document.getElementById('vscrollOuter');
  if (!outer) return;
  vsOuter = outer;
  let resizeTimer;
  new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => renderGrid(), 80); }).observe(outer);
}

// ─────────────────────────────────────────────
// SELECTION
// ─────────────────────────────────────────────
function toggleSelect(e, idx) {
  e.stopPropagation();
  if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
  renderVisible();
  updateCount();
}

// ─────────────────────────────────────────────
// DETAIL MODAL
// ─────────────────────────────────────────────
function openModal(idx) {
  const c = allCharts[idx]; if (!c) return;
  document.getElementById('modalJacket').innerHTML = c.jacketBase64
    ? `<img src="${c.jacketBase64}" alt="${escHtml(c.title)}">` : '🎵';
  document.getElementById('modalTitle').textContent = c.title;
  document.getElementById('modalArtist').textContent = c.artist || '—';
  document.getElementById('modalTags').innerHTML = [
    c.genre   ? `<span class="modal-tag tag-genre">${escHtml(c.genre)}</span>` : '',
    c.bpm     ? `<span class="modal-tag tag-bpm">♩ ${c.bpm} BPM</span>` : '',
    c.version ? `<span class="modal-tag tag-ver">${escHtml(c.version)}</span>` : ''
  ].join('');
  document.getElementById('diffTableBody').innerHTML = c.diffs.map(d =>
    `<tr><td><div class="diff-name"><span class="diff-dot dot-${d.index}"></span>${d.name}</div></td>`+
    `<td><span class="lv-display">${d.level}</span></td>`+
    `<td style="color:var(--color-text-muted)">${escHtml(d.designer)}</td></tr>`
  ).join('');
  document.getElementById('notesSection').innerHTML = c.diffs.map(d => d.notes
    ? `<div style="margin-bottom:var(--sp4)"><div class="section-label">${d.name} — nuty</div>`+
      `<span class="notes-toggle" onclick="var n=this.nextElementSibling;n.style.display=n.style.display==='none'?'block':'none'">👁 Pokaż/ukryj nuty</span>`+
      `<div class="notes-section" style="display:none">${escHtml(d.notes)}</div></div>` : ''
  ).join('');
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(e) { if (e.target===document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key==='Escape') { closeModalDirect(); document.getElementById('exportOverlay').classList.remove('open'); } });

// ─────────────────────────────────────────────
// EXPORT MODAL
// ─────────────────────────────────────────────
function openExportModal() {
  const src = selected.size > 0 ? [...selected].map(i=>allCharts[i]) : filtered;
  const info = document.getElementById('exportInfo');
  info.textContent = selected.size > 0
    ? `Eksportuje ${src.length} zaznaczonych chartów.`
    : `Eksportuje wszystkie ${src.length} widocznych chartów (brak zaznaczenia).`;
  document.getElementById('exportOverlay').classList.add('open');
}
function closeExportModal(e) { if (e.target===document.getElementById('exportOverlay')) document.getElementById('exportOverlay').classList.remove('open'); }

async function doExport() {
  const name = document.getElementById('exportName').value.trim() || 'Moja playlista';
  const src = selected.size > 0 ? [...selected].map(i=>allCharts[i]) : filtered;

  const hashes = src.map(c => c.hash).filter(Boolean);
  const unique = [...new Set(hashes)].sort();

  const payload = { Name: name, SongHashs: unique, IsPlayList: true };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name.replace(/[^\w\-. ]/g,'_') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('exportOverlay').classList.remove('open');
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => { if (loadSession()) renderUI(); });
</script>
